<form [formGroup]="jabberForm" class="jabber-form" autocomplete="off" (ngSubmit)="login()">

  <h4 class="jabber-form__title">Logowanie</h4>

  <div class="jabber-form__main">

    <div class="field" *ngFor="let item of formSkeleton">

      <label [for]="item.codeName" class="field__label">
        {{item.label}}
      </label>

      <input
        [type]="item.type"
        [formControlName]="item.codeName"
        class="field__input"
        [id]="item.codeName"
        [placeholder]="item.placeholder"
      >

    </div>


    <button class="btn-submit" type="submit" [disabled]="jabberForm.invalid">
      Zaloguj sie
    </button>

  </div>

  <div class="bottom">

    <a class="bottom__link">
      <mat-icon>lock_reset</mat-icon>
      <span>Przypomnij haslo</span>
    </a>

    <a class="bottom__link">
      <mat-icon>person_add</mat-icon>
      <span>Zarejestruj sie</span>
    </a>

  </div>

</form>
