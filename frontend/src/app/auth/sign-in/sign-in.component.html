<form [formGroup]="jabberForm" class="jabber-form" autocomplete="off">

  <div class="field" *ngFor="let item of formSkeleton">

    <label [for]="item.codeName" class="field__label">
      {{item.label}}
    </label>

    <input
      [type]="item.type"
      class="field__input"
      [id]="item.codeName"
      [placeholder]="item.placeholder"
    >

  </div>


  <button
    class="btn-submit"
    type="submit"
  >
    zaloguj sie
  </button>

</form>
